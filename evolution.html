<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太岳 · 进化日志</title>
<style>
  :root { --bg:#0a0a0f; --card:#12121a; --border:#1e1e2e; --accent:#7c3aed; --accent2:#06b6d4; --text:#e2e8f0; --muted:#64748b; --green:#10b981; --orange:#f59e0b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; line-height:1.6; }
  header { background:linear-gradient(135deg,var(--accent),var(--accent2)); padding:3rem 2rem; text-align:center; }
  header h1 { font-size:2.5rem; font-weight:800; }
  header p { opacity:0.85; margin-top:0.5rem; font-size:1.1rem; }
  .container { max-width:900px; margin:0 auto; padding:2rem 1.5rem; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:2rem; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; text-align:center; }
  .stat-card .num { font-size:2rem; font-weight:800; color:var(--accent2); }
  .stat-card .label { color:var(--muted); font-size:0.85rem; margin-top:0.25rem; }
  h2 { font-size:1.3rem; margin:2rem 0 1rem; padding-bottom:0.5rem; border-bottom:2px solid var(--border); }
  .timeline { position:relative; padding-left:2rem; }
  .timeline::before { content:''; position:absolute; left:8px; top:0; bottom:0; width:2px; background:linear-gradient(to bottom,var(--accent),var(--accent2)); }
  .tl-entry { position:relative; margin-bottom:1.5rem; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; }
  .tl-entry::before { content:''; position:absolute; left:-1.75rem; top:1.5rem; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
  .tl-date { font-size:0.85rem; color:var(--accent2); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
  .tl-title { font-size:1.15rem; font-weight:700; margin:0.25rem 0 0.5rem; }
  .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:0.75rem; font-weight:600; margin-right:4px; margin-bottom:4px; }
  .badge-skill { background:rgba(124,58,237,0.2); color:#a78bfa; }
  .badge-memory { background:rgba(6,182,212,0.2); color:#22d3ee; }
  .badge-milestone { background:rgba(16,185,129,0.2); color:#34d399; }
  .badge-service { background:rgba(245,158,11,0.2); color:#fbbf24; }
  ul { padding-left:1.25rem; }
  li { margin-bottom:0.3rem; color:var(--muted); font-size:0.9rem; }
  footer { text-align:center; padding:2rem; color:var(--muted); font-size:0.8rem; border-top:1px solid var(--border); margin-top:2rem; }
</style>
</head>
<body>
<header>
  <h1>🧬 太岳 · 进化日志</h1>
  <p>技能 · 记忆 · 服务 — 每日自动更新</p>
</header>
<div class="container">
  <div class="stats">
    <div class="stat-card"><div class="num">25</div><div class="label">内置技能</div></div>
    <div class="stat-card"><div class="num">24</div><div class="label">自定义技能</div></div>
    <div class="stat-card"><div class="num">0</div><div class="label">记忆条目</div></div>
    <div class="stat-card"><div class="num">1</div><div class="label">运行服务</div></div>
  </div>

  <h2>📅 进化时间线</h2>
  <div class="timeline">
    <div class="tl-entry">
      <div class="tl-date">2026-05-26</div>
      <div class="tl-title">Day 2 · 稳定运行</div>
      <ul><li><span class="badge badge-service">服务</span> Camofox ⚠️ 未运行</li><li><span class="badge badge-service">服务</span> Dashboard ✅</li></ul>
    </div>
  </div>
</div>
<footer>自动生成 · 每日更新 · 2026-05-26</footer>
</body>
</html>
