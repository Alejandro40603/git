<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太岳 · 进化记录</title>
    <style>
        :root {
            --bg: #0f111a; --card: #161822; --border: #1e2030;
            --accent: #667eea; --accent2: #54eeb7;
            --text: #e6e8f0; --muted: #9ca3af; --subtle: #6b7280;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.6; padding: 2rem 1.5rem;
            max-width: 1200px; margin: 0 auto;
        }
        /* ─── Header ─── */
        .header { text-align: center; margin-bottom: 3rem; padding: 2rem 0; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            margin: 0 auto 1rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
        }
        .header h1 { font-size: 2.5rem; color: #fff; margin-bottom: 0.5rem; }
        .header .subtitle { color: var(--muted); font-size: 1.1rem; }

        /* ─── Stats Grid ─── */
        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem; margin-bottom: 3rem;
        }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 1.5rem; text-align: center;
            position: relative; overflow: hidden;
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2));
        }
        .stat-card .stat-icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .stat-card .stat-num { font-size: 2.2rem; font-weight: 800; color: #fff; }
        .stat-card .stat-label { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; }

        /* ─── Sections ─── */
        .section { margin-bottom: 3rem; }
        .section-title {
            font-size: 1.4rem; margin-bottom: 1.2rem; color: #fff;
            padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 0.5rem;
        }

        /* ─── Overview ─── */
        .overview-cards {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }
        .overview-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.2rem;
        }
        .overview-card h3 { font-size: 1rem; color: var(--accent2); margin-bottom: 0.4rem; }
        .overview-card p { color: var(--muted); font-size: 0.9rem; }

        /* ─── Skills ─── */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.8rem;
        }
        .skill-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 1rem;
            cursor: default;
            transition: border-color 0.2s, transform 0.15s;
        }
        .skill-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .skill-card .skill-name { font-weight: 600; color: #fff; font-size: 0.95rem; }
        .skill-card .skill-desc { color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; line-height: 1.4; }
        .skill-card .skill-tags { margin-top: 0.5rem; display: flex; gap: 4px; flex-wrap: wrap; }
        .skill-tag {
            font-size: 0.68rem; padding: 2px 7px; border-radius: 5px;
            background: rgba(102,126,234,0.15); color: var(--accent);
        }

        /* ─── Memory ─── */
        .memory-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 0.8rem;
        }
        .memory-card {
            background: var(--card); border: 1px solid var(--border);
            border-left: 3px solid var(--accent2);
            border-radius: 0 10px 10px 0; padding: 1rem;
        }
        .memory-card .memory-num {
            font-size: 0.7rem; color: var(--accent); font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .memory-card .memory-text { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }

        /* ─── Timeline ─── */
        .timeline { position: relative; padding-left: 2rem; }
        .timeline::before {
            content: ''; position: absolute; left: 8px; top: 0; bottom: 0;
            width: 2px; background: linear-gradient(to bottom, var(--accent), var(--accent2));
        }
        .tl-entry {
            position: relative; margin-bottom: 1.5rem;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.2rem;
        }
        .tl-entry::before {
            content: ''; position: absolute; left: -1.75rem; top: 1.5rem;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent); border: 3px solid var(--bg);
            box-shadow: 0 0 8px rgba(102,126,234,0.3);
        }
        .tl-date {
            font-size: 0.8rem; color: var(--accent2); font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .tl-title { font-size: 1.1rem; font-weight: 700; margin: 0.3rem 0 0.5rem; }
        .tl-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .tl-badge {
            font-size: 0.7rem; padding: 2px 8px; border-radius: 5px;
            font-weight: 600;
        }
        .bd-skill { background: rgba(102,126,234,0.2); color: #8b9cf7; }
        .bd-memory { background: rgba(84,238,183,0.2); color: #72f5c5; }
        .bd-service { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .bd-milestone { background: rgba(16,185,129,0.2); color: #34d399; }
        .tl-items { font-size: 0.85rem; color: var(--muted); }
        .tl-items span { display: block; padding: 2px 0; }

        /* ─── Footer ─── */
        .footer {
            text-align: center; margin-top: 4rem; padding-top: 2rem;
            color: var(--subtle); font-size: 0.8rem;
            border-top: 1px solid var(--border);
        }
        .footer a { color: var(--accent); text-decoration: none; }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 1.8rem; }
            .skills-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }

        /* ─── Update badge ─── */
        .update-badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            background: rgba(84,238,183,0.1); color: var(--accent2);
            font-size: 0.75rem; margin-top: 0.5rem;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="avatar">🧬</div>
    <h1>太岳 · 进化记录</h1>
    <p class="subtitle">技能 · 记忆 · 服务 — AI 能力成长追踪</p>
    <span class="update-badge" id="updateBadge"></span>
</div>

<div class="stats-grid" id="statsGrid"></div>

<div class="section">
    <h2 class="section-title"><span>🪪</span> 进化概览</h2>
    <div class="overview-cards" id="overviewCards"></div>
</div>

<div class="section">
    <h2 class="section-title"><span>⚡</span> 已掌握的 Skills</h2>
    <div class="skills-grid" id="skillsGrid"></div>
</div>

<div class="section">
    <h2 class="section-title"><span>💗</span> 持久记忆</h2>
    <div class="memory-cards" id="memoryCards"></div>
</div>

<div class="section">
    <h2 class="section-title"><span>📅</span> 进化时间线</h2>
    <div class="timeline" id="timeline"></div>
</div>

<div class="footer">
    <p>每日自动更新 · <a href="https://github.com/Alejandro40603/git">github.com/Alejandro40603/git</a></p>
</div>

<script>
// ═══════════ DATA ═══════════
const DATA = {{DATA_PLACEHOLDER}};

// ═══════════ RENDER ═══════════
document.getElementById('updateBadge').textContent = '📅 ' + DATA.date;

// Stats
const stats = [
    { icon: '⚡', num: DATA.skills.length, label: '已掌握技能' },
    { icon: '💗', num: DATA.memories.length, label: '持久记忆' },
    { icon: '🟢', num: Object.values(DATA.services).filter(Boolean).length, label: '运行中服务' },
    { icon: '📦', num: 1, label: 'Git 仓库' },
];
document.getElementById('statsGrid').innerHTML = stats.map(s => `
    <div class="stat-card">
        <div class="stat-icon">${s.icon}</div>
        <div class="stat-num">${s.num}</div>
        <div class="stat-label">${s.label}</div>
    </div>
`).join('');

// Overview
const svcText = [];
if (DATA.services.camofox) svcText.push('✅ Camofox 浏览器 (localhost:9377)');
else svcText.push('⚠️ Camofox 未运行');
if (DATA.services.dashboard) svcText.push('✅ Dashboard (localhost:9119)');
else svcText.push('⚠️ Dashboard 未运行');

document.getElementById('overviewCards').innerHTML = `
    <div class="overview-card">
        <h3>🧠 模型</h3>
        <p>DeepSeek v4 Pro · 稳定运行</p>
    </div>
    <div class="overview-card">
        <h3>🌐 服务</h3>
        <p>${svcText.join('<br>')}</p>
    </div>
    <div class="overview-card">
        <h3>🔗 仓库</h3>
        <p>github.com/Alejandro40603/git · main 分支</p>
    </div>
`;

// Skills
document.getElementById('skillsGrid').innerHTML = DATA.skills.map(s => `
    <div class="skill-card">
        <div class="skill-name">${s.name}</div>
        <div class="skill-desc">${s.desc || '已安装技能'}</div>
        <div class="skill-tags">
            <span class="skill-tag">skill</span>
        </div>
    </div>
`).join('');

// Memories
document.getElementById('memoryCards').innerHTML = DATA.memories.map((m, i) => `
    <div class="memory-card">
        <div class="memory-num">#${i + 1}</div>
        <div class="memory-text">${m}</div>
    </div>
`).join('');

// Timeline
const typeMap = {
    milestone: ['bd-milestone', '里程碑'],
    skill: ['bd-skill', '技能'],
    memory: ['bd-memory', '记忆'],
    service: ['bd-service', '服务']
};
document.getElementById('timeline').innerHTML = DATA.history.map(day => `
    <div class="tl-entry">
        <div class="tl-date">${day.date}</div>
        <div class="tl-title">${day.title || '进化记录'}</div>
        <div class="tl-badges">${day.milestones?.map(m => {
            const [cls, label] = typeMap[m.type] || ['bd-milestone', m.type];
            return `<span class="tl-badge ${cls}">${label}</span>`;
        }).join('') || ''}</div>
        <div class="tl-items">
            ${day.milestones?.map(m => `<span>· ${m.text}</span>`).join('') || ''}
        </div>
    </div>
`).join('');

// If no history yet, show placeholder
if (!DATA.history.length) {
    document.getElementById('timeline').innerHTML = '<p style="color:var(--muted); padding:2rem 0;">⏳ 进化数据收集中，明天开始记录...</p>';
}
</script>

</body>
</html>
